         padding: 0.2rem 0;\n        }\n\n        .chat-list::-webkit-scrollbar { width: 4px; }\n        .chat-list::-webkit-scrollbar-track { background: transparent; }\n        .chat-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }\n\n        .chat-item {\n            background: var(--sidebar-item-bg);\n            color: var(--sidebar-item-color);\n            border: 1px solid var(--sidebar-item-border);\n            padding: 0.6rem 0.9rem;\n            border-radius: 1rem;\n            cursor: pointer;\n            font-size: 0.82rem;\n            font-family: inherit;\n            transition: all 0.15s ease;\n            display: flex;\n            align-items: center;\n            gap: 0.4rem;\n            white-space: nowrap;\n            overflow: hidden;\n            text-overflow: ellipsis;\n            text-align: left;\n            width: 100%;\n        }\n\n        .chat-item:hover {\n            background: var(--sidebar-item-hover-bg);\n        }\n\n        .chat-item.active {\n            background: var(--sidebar-item-active-bg);\n            color: var(--sidebar-item-active-color);\n            border-color: var(--sidebar-item-active-border);\n            box-shadow: 0 3px 10px rgba(0, 100, 200, 0.25);\n        }\n\n        .chat-item .chat-icon {\n            flex-shrink: 0;\n            font-size: 0.9rem;\n        }\n\n        .chat-item .chat-label {\n            overflow: hidden;\n            text-overflow: ellipsis;\n            white-space: nowrap;\n            flex: 1;\n        }\n\n        .main-content {\n            flex: 1;\n            min-width: 0;\n            background: var(--container-bg);\n            backdrop-filter: blur(12px);\n            border-radius: 2.5rem;\n            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(80, 160, 255, 0.1);\n            padding: 1.5rem 1.8rem 1.8rem;\n            border: 1px solid var(--container-border);\n            display: flex;\n            flex-direction: column;\n            transition: background 0.4s ease, border-color 0.4s ease;\n            overflow: hidden;\n        }\n\n        .top-nav {\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            margin-bottom: 0.7rem;\n            flex-wrap: wrap;\n            gap: 0.5rem;\n        }\n\n        .nav-pages {\n            display: flex;\n            gap: 0.45rem;\n            flex-wrap: wrap;\n        }\n\n        .nav-item {\n            background: var(--nav-item-bg);\n            color: var(--nav-item-color);\n            border: 1px solid var(--nav-item-border);\n            padding: 0.45rem 1rem;\n            border-radius: 100px;\n            cursor: pointer;\n            font-size: 0.82rem;\n            font-family: inherit;\n            font-weight: 500;\n            transition: all 0.2s ease;\n        }\n\n        .nav-item:hover {\n            background: var(--nav-item-hover-bg);\n            color: var(--nav-item-hover-color);\n        }\n\n        .nav-item.active {\n            background: var(--nav-item-active-bg);\n            color: var(--nav-item-active-color);\n            border-color: var(--nav-item-active-border);\n            box-shadow: 0 4px 12px rgba(0, 100, 200, 0.3);\n        }\n\n        .theme-toggle {\n            background: var(--nav-item-bg);\n            color: var(--nav-item-color);\n            border: 1px solid var(--nav-item-border);\n            padding: 0.45rem 0.9rem;\n            border-radius: 100px;\n            cursor: pointer;\n            font-size: 0.8rem;\n            font-family: inherit;\n            font-weight: 500;\n            transition: all 0.2s ease;\n            display: flex;\n            align-items: center;\n            gap: 0.35rem;\n        }\n\n        .theme-toggle:hover {\n            background: var(--nav-item-hover-bg);\n            color: var(--nav-item-hover-color);\n        }\n\n        .page-title {\n            font-size: 1.5rem;\n            font-weight: 700;\n            letter-spacing: -0.02em;\n            color: var(--text-primary);\n            display: flex;\n            align-items: center;\n            gap: 0.6rem;\n            margin-bottom: 0.8rem;\n            flex-wrap: wrap;\n            transition: color 0.4s ease;\n        }\n\n        .page-title .badge-ai {\n            background: var(--btn-bg);\n            color: white;\n            font-size: 0.75rem;\n            padding: 0.2rem 0.8rem;\n            border-radius: 100px;\n            font-weight: 500;\n            border: 1px solid var(--btn-border);\n        }\n\n        .page-title .badge-math {\n            background: #2d1e3d;\n            color: #c78aff;\n            font-size: 0.68rem;\n            padding: 0.15rem 0.7rem;\n            border-radius: 100px;\n            font-weight: 500;\n            border: 1px solid #7a3eb0;\n        }\n\n        .page-title .badge-mixed {\n            background: #3d2e1a;\n            color: #ffb347;\n            font-size: 0.68rem;\n            padding: 0.15rem 0.7rem;\n            border-radius: 100px;\n            font-weight: 500;\n            border: 1px solid #b57c2e;\n        }\n\n        .page-title .badge-range {\n            background: #1a2e1a;\n            color: #6effa0;\n            font-size: 0.6rem;\n            padding: 0.12rem 0.55rem;\n            border-radius: 100px;\n            font-weight: 500;\n            border: 1px solid #2e7a3e;\n            font-family: 'JetBrains Mono', monospace;\n        }\n\n        .mode-bar {\n            display: flex;\n            gap: 0.4rem;\n            margin-bottom: 0.8rem;\n            flex-wrap: wrap;\n            align-items: center;\n        }\n\n        .mode-btn {\n            background: var(--nav-item-bg);\n            color: var(--nav-item-color);\n            border: 1px solid var(--nav-item-border);\n            padding: 0.4rem 0.9rem;\n            border-radius: 100px;\n            cursor: pointer;\n            font-size: 0.78rem;\n            font-family: inherit;\n            font-weight: 500;\n            transition: all 0.2s ease;\n        }\n\n        .mode-btn:hover {\n            background: var(--nav-item-hover-bg);\n            color: var(--nav-item-hover-color);\n        }\n\n        .mode-btn.active {\n            background: var(--nav-item-active-bg);\n            color: var(--nav-item-active-color);\n            border-color: var(--nav-item-active-border);\n        }\n\n        .mode-btn.mixed-btn.active {\n            background: #b57c2e;\n            border-color: #ffb347;\n            color: white;\n        }\n\n        .mode-label {\n            color: var(--text-secondary);\n            font-size: 0.75rem;\n            margin-left: 0.2rem;\n        }\n\n        .page { display: none; flex: 1; min-height: 0; flex-direction: column; }\n        .page.active { display: flex; }\n\n        .chat-area {\n            flex: 1;\n            background: var(--chat-bg);\n            border-radius: 1.5rem;\n            padding: 1.2rem;\n            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);\n            border: 1px solid var(--chat-border);\n            overflow-y: auto;\n            display: flex;\n            flex-direction: column;\n            gap: 0.9rem;\n            margin-bottom: 1rem;\n            transition: background 0.4s ease, border-color 0.4s ease;\n            min-height: 0;\n        }\n\n        .chat-area::-webkit-scrollbar { width: 5px; }\n        .chat-area::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 8px; }\n        .chat-area::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }\n\n        .holiday-center {\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            flex: 1;\n            text-align: center;\n            padding: 1.5rem;\n            animation: fadeIn 0.8s ease;\n        }\n\n        .holiday-emoji {\n            font-size: 3.8rem;\n            margin-bottom: 0.8rem;\n            animation: pulse 2s infinite ease-in-out;\n        }\n\n        .holiday-text {\n            font-size: 2.4rem;\n            font-weight: 800;\n            letter-spacing: 0.05em;\n            background: linear-gradient(135deg, var(--text-primary), #c78aff);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            background-clip: text;\n            margin-bottom: 0.6rem;\n            line-height: 1.3;\n        }\n\n        .holiday-sub {\n            font-size: 1rem;\n            color: var(--text-secondary);\n            font-weight: 400;\n            margin-bottom: 0.4rem;\n        }\n\n        .holiday-date {\n            font-size: 0.82rem;\n            color: var(--text-secondary);\n            opacity: 0.7;\n            font-family: 'JetBrains Mono', monospace;\n        }\n\n        @keyframes pulse {\n            0%, 100% { transform: scale(1); }\n            50% { transform: scale(1.08); }\n        }\n\n        .message { display: flex; align-items: flex-start; gap: 0.7rem; animation: fadeIn 0.25s ease; }\n        .message.user { flex-direction: row-reverse; }\n\n        .avatar {\n            width: 34px; height: 34px; border-radius: 34px;\n            background: var(--avatar-bg);\n            display: flex; align-items: center; justify-content: center;\n            font-size: 1.1rem; flex-shrink: 0;\n            border: 1px solid var(--avatar-border);\n            color: var(--avatar-color);\n            transition: background 0.4s ease;\n        }\n\n        .message.user .avatar {\n            background: var(--avatar-user-bg);\n            border-color: var(--avatar-user-border);\n            color: white;\n        }\n\n        .bubble {\n            background: var(--bubble-bot-bg);\n            padding: 0.8rem 1.1rem;\n            border-radius: 1.3rem 1.3rem 1.3rem 0.4rem;\n            max-width: 82%;\n            color: var(--bubble-bot-color);\n            line-height: 1.55;\n            font-size: 0.95rem;\n            border: 1px solid var(--bubble-bot-border);\n            word-break: break-word;\n            white-space: pre-wrap;\n            transition: background 0.4s ease, color 0.4s ease;\n        }\n\n        .message.user .bubble {\n            background: var(--bubble-user-bg);\n            color: var(--bubble-user-color);\n            border-radius: 1.3rem 1.3rem 0.4rem 1.3rem;\n            border: 1px solid var(--bubble-user-border);\n        }\n\n        .math-result {\n            background: var(--math-bg) !important;\n            border-left: 5px solid var(--math-border) !important;\n            color: var(--text-primary) !important;\n            font-family: 'JetBrains Mono', 'Fira Code', monospace;\n            font-size: 0.9rem;\n        }\n\n        .math-result .expr { color: #ffd966; font-weight: 600; }\n        .math-result .result-value {\n            color: #6effa0; font-weight: 700; font-size: 1.05rem;\n            word-break: break-all; line-height: 1.5;\n        }\n\n        .translate-result {\n            background: var(--translate-bg) !important;\n            border-left: 5px solid var(--translate-border) !important;\n            color: var(--text-primary) !important;\n            font-size: 0.92rem;\n        }\n\n        .translate-result.mixed {\n            background: var(--translate-mixed-bg) !important;\n            border-left-color: var(--translate-mixed-border) !important;\n        }\n\n        .translate-result .src { color: var(--text-secondary); font-size: 0.84rem; }\n        .translate-result .dst {\n            color: #2e9a4e; font-weight: 600; font-size: 1rem;\n            margin-top: 0.25rem; word-break: break-word;\n        }\n\n        .translate-result.mixed .dst {\n            color: #d4a04a;\n        }\n\n        .translate-result .lang-tag {\n            display: inline-block; background: #1a3a2a; color: #6effa0;\n            font-size: 0.68rem; padding: 0.1rem 0.5rem;\n            border-radius: 100px; margin-right: 0.3rem;\n            border: 1px solid #2e7a4e;\n        }\n\n        .translate-result.mixed .lang-tag {\n            background: #3d2e1a;\n            color: #ffb347;\n            border-color: #b57c2e;\n        }\n\n        .input-area {\n            display: flex; gap: 0.6rem; align-items: center;\n            background: var(--input-bg);\n            padding: 0.2rem 0.2rem 0.2rem 1.1rem;\n            border-radius: 100px;\n            border: 1px solid var(--input-border);\n            transition: background 0.4s ease, border-color 0.4s ease;\n            flex-shrink: 0;\n        }\n\n        .input-area input {\n            flex: 1; border: none; outline: none; font-size: 0.95rem;\n            padding: 0.75rem 0.2rem; background: transparent;\n            color: var(--input-color);\n            font-family: 'JetBrains Mono', 'Fira Code', monospace;\n            transition: color 0.4s ease;\n        }\n\n        .input-area input::placeholder {\n            color: var(--input-placeholder);\n            font-weight: 300;\n            font-family: 'Inter', sans-serif;\n        }\n\n        .input-area button {\n            background: var(--btn-bg);\n            border: none; color: white;\n            width: 44px; height: 44px; border-radius: 100px;\n            display: flex; align-items: center; justify-content: center;\n            cursor: pointer; transition: all 0.2s ease;\n            font-size: 1.2rem; flex-shrink: 0;\n            border: 1px solid var(--btn-border);\n        }\n\n        .input-area button:hover {\n            background: var(--btn-hover);\n            transform: scale(1.02);\n        }\n\n        .input-area button:active { transform: scale(0.96); }\n\n        @keyframes fadeIn {\n            from { opacity: 0; transform: translateY(8px); }\n            to { opacity: 1; transform: translateY(0); }\n        }\n\n        .typing-indicator {\n            display: flex; align-items: center; gap: 4px; padding: 0.3rem 0.7rem;\n        }\n\n        .typing-indicator span {\n            width: 6px; height: 6px; background: var(--text-secondary);\n            border-radius: 50%; display: inline-block;\n            animation: bounce 1.4s infinite ease-in-out both;\n        }\n\n        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }\n        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }\n        .typing-indicator span:nth-child(3) { animation-delay: 0s; }\n\n        @keyframes bounce {\n            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }\n            40% { transform: scale(1); opacity: 1; }\n        }\n\n        .range-hint {\n            font-size: 0.72rem; color: #3f6e4a; background: #0e1f14;\n            padding: 0.2rem 0.7rem; border-radius: 100px;\n            border: 1px solid #1e4a2a;\n            font-family: 'JetBrains Mono', monospace;\n            display: inline-block; margin-top: 0.25rem;\n        }\n\n        @media (max-width: 768px) {\n            .app-layout {\n                flex-direction: column;\n                height: auto;\n                max-height: none;\n            }\n            .sidebar {\n                width: 100%;\n                max-height: 180px;\n                border-radius: 1.5rem;\n                flex-direction: row;\n                align-items: center;\n                padding: 0.8rem;\n                gap: 0.8rem;\n            }\n            .sidebar-header { flex-shrink: 0; }\n            .sidebar-title { display: none; }\n            .new-chat-btn { padding: 0.5rem 0.8rem; font-size: 0.78rem; }\n            .chat-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; }\n            .chat-item { min-width: 120px; }\n            .main-content { border-radius: 2rem; padding: 1.2rem; }\n            .page-title { font-size: 1.2rem; }\n            .holiday-text { font-size: 1.8rem; }\n            .holiday-emoji { font-size: 3rem; }\n            .bubble { max-width: 88%; }\n        }\n    \x3C/style>\n\x3C/head>\n\x3Cbody>\n    \x3Cdiv class=\"app-layout\">\n        \x3Cdiv class=\"sidebar\">\n            \x3Cdiv class=\"sidebar-header\">\n                \x3Cdiv class=\"sidebar-title\">💬 对话\x3C/div>\n            \x3C/div>\n            \x3Cbutton class=\"new-chat-btn\" id=\"newChatBtn\">➕ 开启新对话\x3C/button>\n            \x3Cdiv class=\"chat-list\" id=\"chatList\">\x3C/div>\n        \x3C/div>\n\n        \x3Cdiv class=\"main-content\">\n            \x3Cdiv class=\"top-nav\">\n                \x3Cdiv class=\"nav-pages\">\n                    \x3Cbutton class=\"nav-item active\" data-page=\"chat\">💬 对话\x3C/button>\n                    \x3Cbutton class=\"nav-item\" data-page=\"about\">📖 关于\x3C/button>\n                    \x3Cbutton class=\"nav-item\" data-page=\"help\">❓ 帮助\x3C/button>\n                \x3C/div>\n                \x3Cbutton class=\"theme-toggle\" id=\"themeToggle\">🌙 深色\x3C/button>\n            \x3C/div>\n\n            \x3Cdiv class=\"page active\" id=\"page-chat\">\n                \x3Cdiv class=\"page-title\">\n                    🤖 欠揍AI\n                    \x3Cspan class=\"badge-ai\">多对话版\x3C/span>\n                    \x3Cspan class=\"badge-mixed\">🌐 中英混搭\x3C/span>\n                    \x3Cspan class=\"badge-math\">⚡ AST\x3C/span>\n                \x3C/div>\n\n                \x3Cdiv class=\"mode-bar\">\n                    \x3Cbutton class=\"mode-btn active\" data-mode=\"auto\">🌐 自动\x3C/button>\n                    \x3Cbutton class=\"mode-btn\" data-mode=\"zh\">🇨🇳 中文\x3C/button>\n                    \x3Cbutton class=\"mode-btn\" data-mode=\"en\">🇬🇧 英语\x3C/button>\n                    \x3Cbutton class=\"mode-btn mixed-btn\" data-mode=\"mixed\">🔀 混搭\x3C/button>\n                    \x3Cspan class=\"mode-label\" id=\"modeLabel\">自动识别\x3C/span>\n                \x3C/div>\n\n                \x3Cdiv class=\"chat-area\" id=\"chatArea\">\x3C/div>\n\n                \x3Cdiv class=\"input-area\">\n                    \x3Cinput type=\"text\" id=\"userInput\" placeholder=\"输入数学表达式 / 单词 / 中英混搭句子...\" autocomplete=\"off\" />\n                    \x3Cbutton id=\"sendBtn\" aria-label=\"发送\">➤\x3C/button>\n                \x3C/div>\n            \x3C/div>\n\n            \x3Cdiv class=\"page\" id=\"page-about\">\n                \x3Cdiv class=\"page-title\">📖 关于欠揍AI\x3C/div>\n                \x3Cdiv class=\"chat-area\" style=\"flex:1;\">\n                    \x3Cdiv class=\"message bot\">\n                        \x3Cdiv class=\"avatar\">🤖\x3C/div>\n                        \x3Cdiv class=\"bubble\">\n                            \x3Cstrong>欠揍AI\x3C/strong> 是一个纯前端的多功能 AI 助手，内置：\x3Cbr>\x3Cbr>\n                            \x3Cspan style=\"color:#7fc9ff;\">📐 数学 AST 递推分解器\x3C/span>\x3Cbr>\n                            支持实数/复数、三角/反三角、素数、积分/微分、极限/阶乘/级数、欧拉公式。\x3Cbr>\x3Cbr>\n                            \x3Cspan style=\"color:#6effa0;\">🌐 中英词典\x3C/span>\x3Cbr>\n                            支持缩写、词形变化、中英互译。\x3Cbr>\x3Cbr>\n                            \x3Cspan style=\"color:#ffb347;\">🔀 中英混搭\x3C/span>\x3Cbr>\n                            句子中同时有中英文时自动识别，保留中文、翻译英文。\x3Cbr>\x3Cbr>\n                            \x3Cspan style=\"color:#ffb347;\">📚 知识库\x3C/span>\x3Cbr>\n                            算法、编程、历史、生物、政治、科学常识。\n                        \x3C/div>\n                    \x3C/div>\n                \x3C/div>\n            \x3C/div>\n\n            \x3Cdiv class=\"page\" id=\"page-help\">\n                \x3Cdiv class=\"page-title\">❓ 使用帮助\x3C/div>\n                \x3Cdiv class=\"chat-area\" style=\"flex:1;\">\n                    \x3Cdiv class=\"message bot\">\n                        \x3Cdiv class=\"avatar\">🤖\x3C/div>\n                        \x3Cdiv class=\"bubble\">\n                            \x3Cstrong>📐 数学计算（已修复 e^i）\x3C/strong>\x3Cbr>\n                            • 四则运算：\x3Ccode>2+3*4\x3C/code>\x3Cbr>\n                            • 复数：\x3Ccode>(3+4i)*(1-2i)\x3C/code>\x3Cbr>\n                            • 三角：\x3Ccode>sin(pi/2)\x3C/code>\x3Cbr>\n                            • 积分：\x3Ccode>∫(x^2,0,1)\x3C/code>\x3Cbr>\n                            • 极限：\x3Ccode>lim(sin(x)/x,x,0)\x3C/code>\x3Cbr>\n                            • 级数：\x3Ccode>Σ(1/n^2,1,∞)\x3C/code>\x3Cbr>\n                            • 欧拉公式：\x3Ccode>e^i\x3C/code>、\x3Ccode>e^(i*pi)\x3C/code>、\x3Ccode>e^(7891i)\x3C/code>\n                        \x3C/div>\n                    \x3C/div>\n                    \x3Cdiv class=\"message bot\">\n                        \x3Cdiv class=\"avatar\">🤖\x3C/div>\n                        \x3Cdiv class=\"bubble\">\n                            \x3Cstrong>🌐 纯中英翻译\x3C/strong>\x3Cbr>\n                            • 英译中：\x3Ccode>apple 什么意思\x3C/code>\x3Cbr>\n                            • 中译英：\x3Ccode>苹果 英语怎么说\x3C/code>\x3Cbr>\n                            • 缩写：\x3Ccode>I'm\x3C/code>、\x3Ccode>don't\x3C/code>、\x3Ccode>can't\x3C/code>\x3Cbr>\n                            • 词形：\x3Ccode>apples\x3C/code>、\x3Ccode>playing\x3C/code>\n                        \x3C/div>\n                    \x3C/div>\n                    \x3Cdiv class=\"message bot\">\n                        \x3Cdiv class=\"avatar\">🤖\x3C/div>\n                        \x3Cdiv class=\"bubble\">\n                            \x3Cstrong>🔀 中英混搭\x3C/strong>\x3Cbr>\n                            句子中同时有中英文时，自动保留中文、翻译英文：\x3Cbr>\n                            • \x3Ccode>我是gay\x3C/code> → 我是同性恋\x3Cbr>\n                            • \x3Ccode>我是mj\x3C/code> → 我是蜘蛛侠\x3Cbr>\n                            • \x3Ccode>我喜欢apple\x3C/code> → 我喜欢苹果\x3Cbr>\n                            • \x3Ccode>他是my friend\x3C/code> → 他是我的朋友\n                        \x3C/div>\n                    \x3C/div>\n                \x3C/div>\n            \x3C/div>\n        \x3C/div>\n    \x3C/div>\n\n    \x3Cscript>\n        (function() {\n            const STORAGE_KEY = 'qianzou_ai_chats';\n            let chats = [];\n            let currentChatId = null;\n            let currentMode = 'auto';\n            let isLight = false;\n\n            const chatArea = document.getElementById('chatArea');\n            const userInput = document.getElementById('userInput');\n            const sendBtn = document.getElementById('sendBtn');\n            const chatList = document.getElementById('chatList');\n            const newChatBtn = document.getElementById('newChatBtn');\n            const modeLabel = document.getElementById('modeLabel');\n            const themeToggle = document.getElementById('themeToggle');\n\n            function saveChats() {\n                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); } catch (e) {}\n            }\n\n            function loadChats() {\n                try {\n                    const raw = localStorage.getItem(STORAGE_KEY);\n                    if (raw) chats = JSON.parse(raw);\n                } catch (e) { chats = []; }\n                if (!Array.isArray(chats)) chats = [];\n                if (chats.length === 0) createNewChat(false);\n                if (!currentChatId || !chats.find(c => c.id === currentChatId)) {\n                    currentChatId = chats[0].id;\n                }\n                renderChatList();\n                renderChatArea();\n            }\n\n            function generateId() {\n                return 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);\n            }\n\n            function createNewChat(save = true) {\n                const newChat = { id: generateId(), title: '新对话', messages: [] };\n                chats.unshift(newChat);\n                currentChatId = newChat.id;\n                if (save) saveChats();\n                renderChatList();\n                renderChatArea();\n                userInput.focus();\n                return newChat;\n            }\n\n            function getCurrentChat() {\n                return chats.find(c => c.id === currentChatId) || null;\n            }\n\n            function switchChat(id) {\n                if (id === currentChatId) return;\n                currentChatId = id;\n                renderChatList();\n                renderChatArea();\n                userInput.focus();\n            }\n\n            function updateChatTitle(chat, firstMessage) {\n                if (!chat || !firstMessage) return;\n                const text = firstMessage.trim();\n                if (!text) return;\n                const title = text.length > 5 ? text.slice(0, 5) + '...' : text;\n                chat.title = title;\n            }\n\n            function renderChatList() {\n                chatList.innerHTML = '';\n                chats.forEach(chat => {\n                    const btn = document.createElement('button');\n                    btn.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');\n                    btn.innerHTML = `\x3Cspan class=\"chat-icon\">💬\x3C/span>\x3Cspan class=\"chat-label\">${escapeHtml(chat.title)}\x3C/span>`;\n                    btn.addEventListener('click', () => switchChat(chat.id));\n                    chatList.appendChild(btn);\n                });\n            }\n\n            function renderChatArea() {\n                chatArea.innerHTML = '';\n                const chat = getCurrentChat();\n                if (!chat) return;\n                if (chat.messages.length === 0) {\n                    renderHolidayCenter();\n                    return;\n                }\n                chat.messages.forEach(msg => renderMessage(msg, false));\n                chatArea.scrollTop = chatArea.scrollHeight;\n            }\n\n            function getHoliday() {\n                const now = new Date();\n                const month = now.getMonth() + 1;\n                const day = now.getDate();\n                const holidays = {\n                    '1-1': { name: '元旦', emoji: '🎊' },\n                    '2-14': { name: '情人节', emoji: '💕' },\n                    '3-8': { name: '妇女节', emoji: '🌹' },\n                    '3-12': { name: '植树节', emoji: '🌳' },\n                    '4-1': { name: '愚人节', emoji: '🤡' },\n                    '5-1': { name: '劳动节', emoji: '💪' },\n                    '5-4': { name: '青年节', emoji: '🔥' },\n                    '6-1': { name: '儿童节', emoji: '🧒' },\n                    '7-1': { name: '建党节', emoji: '🇨🇳' },\n                    '8-1': { name: '建军节', emoji: '🎖️' },\n                    '9-10': { name: '教师节', emoji: '📚' },\n                    '10-1': { name: '国庆节', emoji: '🇨🇳' },\n                    '12-24': { name: '平安夜', emoji: '🎄' },\n                    '12-25': { name: '圣诞节', emoji: '🎅' },\n                };\n                const key = month + '-' + day;\n                if (holidays[key]) return { ...holidays[key], date: now };\n                return null;\n            }\n\n            function isWeekend() {\n                const day = new Date().getDay();\n                return day === 0 || day === 6;\n            }\n\n            function renderHolidayCenter() {\n                const holiday = getHoliday();\n                const div = document.createElement('div');\n                div.className = 'holiday-center';\n                if (holiday) {\n                    div.innerHTML = `\n                        \x3Cdiv class=\"holiday-emoji\">${holiday.emoji}\x3C/div>\n                        \x3Cdiv class=\"holiday-text\">${holiday.name}快乐\x3C/div>\n                        \x3Cdiv class=\"holiday-sub\">今天是 ${holiday.name}，祝你节日快乐！\x3C/div>\n                        \x3Cdiv class=\"holiday-date\">${holiday.date.getFullYear()}年${holiday.date.getMonth()+1}月${holiday.date.getDate()}日\x3C/div>\n                    `;\n                } else if (isWeekend()) {\n                    div.innerHTML = `\n                        \x3Cdiv class=\"holiday-emoji\">🎉\x3C/div>\n                        \x3Cdiv class=\"holiday-text\">周末快乐\x3C/div>\n                        \x3Cdiv class=\"holiday-sub\">今天是周末，好好休息一下吧！\x3C/div>\n                        \x3Cdiv class=\"holiday-date\">${new Date().getFullYear()}年${new Date().getMonth()+1}月${new Date().getDate()}日\x3C/div>\n                    `;\n                } else {\n                    div.innerHTML = `\n                        \x3Cdiv class=\"holiday-emoji\">🤖\x3C/div>\n                        \x3Cdiv class=\"holiday-text\">你好呀\x3C/div>\n                        \x3Cdiv class=\"holiday-sub\">我是欠揍AI，输入问题或数学表达式开始对话吧\x3C/div>\n                        \x3Cdiv class=\"holiday-date\">${new Date().getFullYear()}年${new Date().getMonth()+1}月${new Date().getDate()}日\x3C/div>\n                    `;\n                }\n                chatArea.appendChild(div);\n            }\n\n            function renderMessage(msg, scroll = true) {\n                const messageDiv = document.createElement('div');\n                messageDiv.classList.add('message', msg.sender);\n                const avatarDiv = document.createElement('div');\n                avatarDiv.classList.add('avatar');\n                avatarDiv.textContent = msg.sender === 'user' ? '👤' : '🤖';\n                const bubbleDiv = document.createElement('div');\n                bubbleDiv.classList.add('bubble');\n\n                if (msg.type === 'math' && msg.data) {\n                    bubbleDiv.classList.add('math-result');\n                    bubbleDiv.innerHTML = `\n                        \x3Cdiv style=\"margin-bottom:5px;\">📐 \x3Cspan class=\"expr\">${escapeHtml(msg.data.expr)}\x3C/span>\x3C/div>\n                        \x3Cdiv style=\"font-size:0.85rem;\">AST 解析结果：\x3C/div>\n                        \x3Cdiv class=\"result-value\">${escapeHtml(msg.data.result)}\x3C/div>\n                        ${msg.data.isComplex ? '\x3Cdiv style=\"font-size:0.75rem; color:#c78aff; margin-top:3px;\">ℂ 复数结果\x3C/div>' : ''}\n                        \x3Cdiv class=\"range-hint\">a,b ∈ [-2²⁵⁵, 2²⁵⁵-1] ✅\x3C/div>\n                    `;\n                } else if (msg.type === 'translate' && msg.data) {\n                    bubbleDiv.classList.add('translate-result');\n                    if (msg.data.from === 'mixed') bubbleDiv.classList.add('mixed');\n                    \n                    let langTag = '';\n                    if (msg.data.from === 'en') langTag = '🇬🇧 英语 → 中文';\n                    else if (msg.data.from === 'zh') langTag = '🇨🇳 中文 → 英语';\n                    else if (msg.data.from === 'mixed') langTag = '🔀 中英混搭';\n                    \n                    const posStr = msg.data.pos ? ` \x3Cspan style=\"color:var(--text-secondary);\">(${msg.data.pos})\x3C/span>` : '';\n                    const noteStr = msg.data.note ? `\x3Cdiv style=\"font-size:0.8rem; color:var(--text-secondary); margin-top:3px;\">${escapeHtml(msg.data.note)}\x3C/div>` : '';\n                    bubbleDiv.innerHTML = `\n                        \x3Cdiv>\x3Cspan class=\"lang-tag\">${langTag}\x3C/span>\x3C/div>\n                        \x3Cdiv class=\"src\">原文：${escapeHtml(msg.data.src)}\x3C/div>\n                        \x3Cdiv class=\"dst\">译文：${escapeHtml(msg.data.dst)}${posStr}\x3C/div>\n                        ${noteStr}\n                    `;\n                } else {\n                    bubbleDiv.textContent = msg.text || '';\n                }\n\n                messageDiv.appendChild(avatarDiv);\n                messageDiv.appendChild(bubbleDiv);\n                chatArea.appendChild(messageDiv);\n                if (scroll) chatArea.scrollTop = chatArea.scrollHeight;\n            }\n\n            function escapeHtml(s) {\n                if (typeof s !== 'string') return String(s);\n                return s.replace(/&/g, '&amp;').replace(/\x3C/g, '&lt;').replace(/>/g, '&gt;');\n            }\n\n            function addMessageToChat(msg, scroll = true) {\n                const chat = getCurrentChat();\n                if (!chat) return;\n                if (chat.title === '新对话' && msg.sender === 'user' && msg.text) {\n                    updateChatTitle(chat, msg.text);\n                    renderChatList();\n                }\n                chat.messages.push(msg);\n                saveChats();\n                if (chat.messages.length === 1) chatArea.innerHTML = '';\n                renderMessage(msg, scroll);\n            }\n\n            // ============================================================\n            // 数学引擎\n            // ============================================================\n            const MIN_VAL = -Math.pow(2, 255);\n            const MAX_VAL = Math.pow(2, 255) - 1;\n            const complex = (re, im = 0) => ({ re, im });\n            function cAdd(a, b) { return complex(a.re + b.re, a.im + b.im); }\n            function cSub(a, b) { return complex(a.re - b.re, a.im - b.im); }\n            function cMul(a, b) { return complex(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re); }\n            function cDiv(a, b) {\n                const denom = b.re * b.re + b.im * b.im;\n                if (denom === 0) throw new Error('复数除以零');\n                return complex((a.re * b.re + a.im * b.im) / denom, (a.im * b.re - a.re * b.im) / denom);\n            }\n            function cAbs(a) { return Math.sqrt(a.re * a.re + a.im * a.im); }\n            function cExp(a) {\n                const expRe = Math.exp(a.re);\n                return complex(expRe * Math.cos(a.im), expRe * Math.sin(a.im));\n            }\n            function cSin(a) { return complex(Math.sin(a.re) * Math.cosh(a.im), Math.cos(a.re) * Math.sinh(a.im)); }\n            function cCos(a) { return complex(Math.cos(a.re) * Math.cosh(a.im), -Math.sin(a.re) * Math.sinh(a.im)); }\n            function cTan(a) { return cDiv(cSin(a), cCos(a)); }\n            function cLog(a) {\n                const r = cAbs(a);\n                if (r === 0) throw new Error('对数参数为零');\n                const theta = Math.atan2(a.im, a.re);\n                return complex(Math.log(r), theta);\n            }\n            function cSqrt(a) {\n                const r = cAbs(a);\n                if (r === 0) return complex(0, 0);\n                const theta = Math.atan2(a.im, a.re);\n                const sqrtR = Math.sqrt(r);\n                return complex(sqrtR * Math.cos(theta / 2), sqrtR * Math.sin(theta / 2));\n            }\n            function cPow(a, b) {\n                if (a.re === 0 && a.im === 0) {\n                    if (b.re > 0 && b.im === 0) return complex(0, 0);\n                    if (b.re === 0 && b.im === 0) return complex(1, 0);\n                    throw new Error('0的复数幂未定义');\n                }\n                const logA = cLog(a);\n                const bLogA = cMul(b, logA);\n                return cExp(bLogA);\n            }\n            function toComplex(x) {\n                if (typeof x === 'number') return complex(x, 0);\n                if (x && typeof x.re === 'number' && typeof x.im === 'number') return x;\n                throw new Error('无法转换为复数: ' + x);\n            }\n            function checkRange(c) {\n                const re = c.re, im = c.im;\n                if (isFinite(re) && isFinite(im)) {\n                    if (re \x3C MIN_VAL || re > MAX_VAL) throw new Error(`实部超出范围`);\n                    if (im \x3C MIN_VAL || im > MAX_VAL) throw new Error(`虚部超出范围`);\n                    return c;\n                }\n                if (!isFinite(re) || !isFinite(im)) throw new Error(`结果包含无穷大`);\n                return c;\n            }\n\n            function isPrime(n) {\n                n = Math.floor(n);\n                if (n \x3C 2) return false;\n                if (n === 2) return true;\n                if (n % 2 === 0) return false;\n                for (let i = 3; i * i \x3C= n; i += 2) if (n % i === 0) return false;\n                return true;\n            }\n            function factorial(n) {\n                n = Math.floor(n);\n                if (n \x3C 0) throw new Error('阶乘不支持负数');\n                if (n > 170) return Infinity;\n                let r = 1;\n                for (let i = 2; i \x3C= n; i++) r *= i;\n                return r;\n            }\n            function integrate(fn, a, b, eps = 1e-8) {\n                function simpson(f, a, b) {\n                    const c = (a + b) / 2;\n                    return (b - a) / 6 * (f(a) + 4 * f(c) + f(b));\n                }\n                function adaptive(f, a, b, eps, whole, depth) {\n                    const c = (a + b) / 2;\n                    const left = simpson(f, a, c);\n                    const right = simpson(f, c, b);\n                    const delta = left + right - whole;\n                    if (depth \x3C= 0 || Math.abs(delta) \x3C= 15 * eps) return left + right + delta / 15;\n                    return adaptive(f, a, c, eps / 2, left, depth - 1) +\n                           adaptive(f, c, b, eps / 2, right, depth - 1);\n                }\n                const whole = simpson(fn, a, b);\n                return adaptive(fn, a, b, eps, whole, 20);\n            }\n            function derivative(fn, x, h = 1e-7) { return (fn(x + h) - fn(x - h)) / (2 * h); }\n            function limit(fn, x0) { return fn(x0 + 1e-9); }\n            function sumSeries(fn, start, end, terms = 100000) {\n                let sum = complex(0, 0);\n                if (end === Infinity) {\n                    for (let n = start; n \x3C start + terms; n++) {\n                        sum = cAdd(sum, toComplex(fn(n)));\n                    }\n                } else {\n                    for (let n = start; n \x3C= end; n++) {\n                        sum = cAdd(sum, toComplex(fn(n)));\n                    }\n                }\n                return sum;\n            }\n\n            // ============================================================\n            // 词法分析器（已修复 e^i）\n            // ============================================================\n            function tokenize(s) {\n                s = s.replace(/\\s+/g, '');\n                s = s.replace(/[=？?。，,]+$/g, '');\n                // 预处理：e^数字i → e^(数字i)\n                s = s.replace(/e\\^([+-]?\\d+(?:\\.\\d+)?)i(?![\\d\\w])/g, 'e^($1i)');\n                s = s.replace(/e\\^([+-]?\\d+(?:\\.\\d+)?)\\*i(?![\\d\\w])/g, 'e^($1*i)');\n                // e^i → e^(i)\n                s = s.replace(/e\\^i(?![\\d\\w])/g, 'e^(i)');\n                \n                const tokens = [];\n                let i = 0;\n                while (i \x3C s.length) {\n                    const ch = s[i];\n                    if (/[0-9.]/.test(ch)) {\n                        let numStr = '';\n                        while (i \x3C s.length && /[0-9.]/.test(s[i])) { numStr += s[i]; i++; }\n                        if (i \x3C s.length && (s[i] === 'e' || s[i] === 'E')) {\n                            const next = s[i + 1];\n                            if (next && (/[0-9]/.test(next) || ((next === '+' || next === '-') && s[i + 2] && /[0-9]/.test(s[i + 2])))) {\n                                numStr += s[i]; i++;\n                                if (i \x3C s.length && (s[i] === '+' || s[i] === '-')) { numStr += s[i]; i++; }\n                                while (i \x3C s.length && /[0-9]/.test(s[i])) { numStr += s[i]; i++; }\n                            }\n                        }\n                        tokens.push({ type: 'number', value: parseFloat(numStr) });\n                        continue;\n                    }\n                    if (s.substr(i, 2) === 'pi') {\n                        tokens.push({ type: 'const', value: complex(Math.PI, 0) }); i += 2; continue;\n                    }\n                    if (/[a-zA-Z_]/.test(ch)) {\n                        let name = '';\n                        while (i \x3C s.length && /[a-zA-Z0-9_]/.test(s[i])) { name += s[i]; i++; }\n                        const lower = name.toLowerCase();\n                        // ===== 关键修复：单字母常量优先 =====\n                        if (name.length === 1 && lower === 'e') {\n                            tokens.push({ type: 'const', value: complex(Math.E, 0) });\n                        } else if (name.length === 1 && lower === 'i') {\n                            tokens.push({ type: 'const', value: complex(0, 1) });\n                        } else if (lower === 'pi') {\n                            tokens.push({ type: 'const', value: complex(Math.PI, 0) });\n                        } else if (lower === 'int' || lower === 'integrate') {\n                            tokens.push({ type: 'op', value: 'int' });\n                        } else if (lower === 'sum' || lower === 'sigma') {\n                            tokens.push({ type: 'op', value: 'sum' });\n                        } else if (lower === 'lim' || lower === 'limit') {\n                            tokens.push({ type: 'op', value: 'lim' });\n                        } else if (lower === 'diff' || lower === 'differentiate') {\n                            tokens.push({ type: 'op', value: 'diff' });\n                        } else {\n                            tokens.push({ type: 'func', value: lower });\n                        }\n                        continue;\n                    }\n                    if ('+-*/^(),!\x3C>=√∫Σ∂'.includes(ch)) {\n                        if (ch === '√') { tokens.push({ type: 'func', value: 'sqrt' }); i++; continue; }\n                        if (ch === '∫') { tokens.push({ type: 'op', value: 'int' }); i++; continue; }\n                        if (ch === 'Σ') { tokens.push({ type: 'op', value: 'sum' }); i++; continue; }\n                        if (ch === '∂') { tokens.push({ type: 'op', value: 'diff' }); i++; continue; }\n                        if (ch === '=') { i++; continue; }\n                        tokens.push({ type: 'op', value: ch }); i++; continue;\n                    }\n                    i++;\n                }\n                return tokens;\n            }\n\n            function parse(tokens) {\n                let pos = 0;\n                const peek = () => tokens[pos] || null;\n                const consume = (type, value) => {\n                    const t = tokens[pos];\n                    if (!t) return null;\n                    if (type && t.type !== type) return null;\n                    if (value !== undefined && t.value !== value) return null;\n                    pos++; return t;\n                };\n                function canStartFactor(t) {\n                    if (!t) return false;\n                    return t.type === 'number' || t.type === 'const' || t.type === 'func' || (t.type === 'op' && t.value === '(');\n                }\n                function parseExpr() {\n                    let left = parseTerm();\n                    while (true) {\n                        const t = peek();\n                        if (t && t.type === 'op' && (t.value === '+' || t.value === '-')) {\n                            pos++; const right = parseTerm();\n                            left = { type: 'binary', op: t.value, left, right };\n                        } else break;\n                    }\n                    return left;\n                }\n                function parseTerm() {\n                    let left = parseFactor();\n                    while (true) {\n                        const t = peek();\n                        if (t && t.type === 'op' && (t.value === '*' || t.value === '/')) {\n                            pos++; const right = parseFactor();\n                            left = { type: 'binary', op: t.value, left, right };\n                        } else if (t && canStartFactor(t)) {\n                            const right = parseFactor();\n                            left = { type: 'binary', op: '*', left, right };\n                        } else break;\n                    }\n                    return left;\n                }\n                function parseFactor() {\n                    let base =
